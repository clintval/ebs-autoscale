#cloud-config
# Example user data for an Amazon Linux 2023 ECS-optimized instance that mounts
# an autoscaling scratch volume at /scratch and points the Docker data-root at
# it, so container layers and anonymous volumes grow into elastic EBS storage.
#
# Pin EBS_AUTOSCALE_VERSION to a release tag; do not resolve releases/latest at
# boot, or a new release could change behavior under a running fleet.
#
# The instance profile needs the EBS autoscale permissions (see the README).

output: {all: '| tee -a /var/log/cloud-init-output.log'}

repo_update: true
repo_upgrade: security

packages:
  - jq
  - lvm2
  - unzip

runcmd:
  - set -euxo pipefail

  # Install the AWS CLI v2.
  - curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install -b /usr/bin

  # Stop ECS and Docker while the scratch volume and data-root are set up.
  - systemctl stop ecs || true
  - systemctl stop docker || true

  # Install ebs-autoscale from a pinned release and mount /scratch as lvm.ext4.
  - EBS_AUTOSCALE_VERSION=v1.0.0
  - curl -sL "https://github.com/clintval/ebs-autoscale/archive/refs/tags/${EBS_AUTOSCALE_VERSION}.tar.gz" | tar xz -C /opt/
  - mv "/opt/ebs-autoscale-${EBS_AUTOSCALE_VERSION#v}" /opt/ebs-autoscale
  - sh /opt/ebs-autoscale/install.sh -m /scratch -s 500 -f lvm.ext4 -t gp3 --volume-iops 4000 --volume-throughput 250 > /var/log/ebs-autoscale-install.log 2>&1

  # Point Docker's data-root at the scratch mount (AL2023 uses daemon.json,
  # not the Amazon Linux 2 /etc/sysconfig/docker OPTIONS= form).
  - mkdir -p /scratch/docker
  - mkdir -p /etc/docker
  - echo '{"data-root":"/scratch/docker"}' > /etc/docker/daemon.json

  # Raise file-descriptor limits for container-heavy workloads.
  - echo "* soft nofile 64000" >> /etc/security/limits.conf
  - echo "* hard nofile 128000" >> /etc/security/limits.conf
  - sysctl -w fs.file-max=128000

  # Start Docker, then the ECS agent. --no-block avoids deadlocking the boot
  # transaction when started from cloud-init.
  - systemctl start docker
  - systemctl daemon-reload
  - systemctl start --no-block ecs
